set_schedule:
  name: Set schedule
  description: Configure an AirVersa schedule slot. Target the "Schedule N" switch. Only the fields you supply are changed. Setting start equal to end means all day.
  target:
    entity:
      integration: airversa
      domain: switch
  fields:
    enabled:
      name: Enabled
      selector:
        boolean:
    start:
      name: Start time
      example: "08:00"
      selector:
        time:
    end:
      name: End time
      example: "22:00"
      selector:
        time:
    days:
      name: Days
      example: '["mon", "tue", "wed", "thu", "fri"]'
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    diffuse_seconds:
      name: Diffuse seconds
      description: Length of each burst (device allows 3–300 s).
      example: 45
      selector:
        number:
          min: 3
          max: 300
          unit_of_measurement: s
    pause_seconds:
      name: Pause seconds
      description: Time between bursts (5–3600 s).
      example: 240
      selector:
        number:
          min: 5
          max: 3600
          unit_of_measurement: s
